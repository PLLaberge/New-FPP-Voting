<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>Vote for the Next Song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b16;
  --card:rgba(255,255,255,.055);
  --card-hi:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.10);
  --stroke-hi:rgba(255,255,255,.20);
  --text:#f2f5fb;
  --text-2:#a4b0c9;
  --text-3:#6f7d99;
  --accent:#f6c96b;
  --accent-dim:#c9a153;
  --green:#5fd8a4;
  --radius:16px;
  --radius-sm:11px;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --ease:cubic-bezier(.22,.8,.3,1);
}
/* per-show accent */
body[data-show="halloween"]{--accent:#ff9542;--accent-dim:#c96a24}
body[data-show="nye"]{--accent:#8ab4ff;--accent-dim:#5b83cc}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg-0);color:var(--text);font-weight:400;line-height:1.45;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
.bg{position:fixed;inset:0;z-index:-2;transition:background .6s var(--ease);background:
   radial-gradient(1100px 700px at 12% -10%, #1d2a52 0%, transparent 60%),
   radial-gradient(900px 620px at 100% 0%, #35204a 0%, transparent 55%),
   radial-gradient(800px 700px at 50% 110%, #123a3a 0%, transparent 60%),
   linear-gradient(180deg,#080d1b 0%,#0a1022 45%,#070b16 100%);}
body[data-show="halloween"] .bg{background:
   radial-gradient(1100px 700px at 12% -10%, #4a2410 0%, transparent 60%),
   radial-gradient(900px 620px at 100% 0%, #3a1840 0%, transparent 55%),
   radial-gradient(800px 700px at 50% 110%, #2a1a06 0%, transparent 60%),
   linear-gradient(180deg,#140c08 0%,#160f0c 45%,#0d0805 100%);}
body[data-show="nye"] .bg{background:
   radial-gradient(1100px 700px at 12% -10%, #16305c 0%, transparent 60%),
   radial-gradient(900px 620px at 100% 0%, #21324f 0%, transparent 55%),
   radial-gradient(800px 700px at 50% 110%, #10263f 0%, transparent 60%),
   linear-gradient(180deg,#060c16 0%,#08111f 45%,#050910 100%);}
canvas#snow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5}

.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

/* ---------- demo scaffolding bar ---------- */
.demo{margin:12px 0 0;border:1px dashed rgba(255,255,255,.17);border-radius:var(--radius-sm);
  padding:10px 12px;display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;justify-content:space-between}
.demo-tag{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3);flex:0 0 auto}
.demo-grp{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.mini{display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:100px;padding:2px}
.mini button{font:inherit;font-size:12px;padding:4px 10px;border:0;border-radius:100px;background:none;
  color:var(--text-3);cursor:pointer;transition:all .18s var(--ease);white-space:nowrap}
.mini button[aria-pressed="true"]{background:rgba(255,255,255,.13);color:var(--text);font-weight:500}

/* ---------- masthead ---------- */
.masthead{padding:24px 0 16px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);padding:5px 12px;border-radius:100px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.masthead h1{font-size:clamp(26px,7vw,37px);line-height:1.12;margin:13px 0 6px;font-weight:600;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 15%,#c6d2ea 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.masthead p{margin:0;color:var(--text-2);font-size:15px;font-weight:300}

/* ---------- now playing ---------- */
.np{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--stroke);
  border-radius:var(--radius);padding:18px;margin-bottom:16px;backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.np::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 15%,transparent),transparent 55%)}
.np-top{display:flex;align-items:center;gap:9px;margin-bottom:11px;position:relative}
.bars{display:flex;align-items:flex-end;gap:2.5px;height:13px}
.bars i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s var(--ease) infinite alternate;display:block}
.bars i:nth-child(1){height:45%;animation-delay:0s}
.bars i:nth-child(2){height:100%;animation-delay:.18s}
.bars i:nth-child(3){height:62%;animation-delay:.36s}
.bars i:nth-child(4){height:85%;animation-delay:.10s}
@keyframes eq{from{transform:scaleY(.32)}to{transform:scaleY(1)}}
.np-label{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:500}
.np-title{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px;position:relative}
.np-meta{color:var(--text-2);font-size:14px;margin:0 0 15px;position:relative;font-weight:300}
.track{height:4px;border-radius:4px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-dim),var(--accent));
  border-radius:4px;transition:width .95s linear;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent)}
.np-times{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-3);
  font-variant-numeric:tabular-nums;position:relative}
.closing{color:var(--accent);font-weight:500}

/* ---------- vote allowance meter ---------- */
.meter{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px;
  padding:9px 14px;border-radius:100px;background:var(--card);border:1px solid var(--stroke);font-size:13px}
.pips{display:flex;gap:5px}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-3);transition:all .25s var(--ease)}
.pip.used{background:var(--green);border-color:var(--green);box-shadow:0 0 9px color-mix(in srgb,var(--green) 55%,transparent)}
.meter.full{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.meter span{color:var(--text-2)}
.meter b{color:var(--text);font-weight:500}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:20;padding:10px 16px 8px;margin:0 -16px;
  background:linear-gradient(180deg,rgba(7,11,22,.97) 62%,rgba(7,11,22,0) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body[data-show="halloween"] .controls{background:linear-gradient(180deg,rgba(13,8,5,.97) 62%,rgba(13,8,5,0) 100%)}
body[data-show="nye"] .controls{background:linear-gradient(180deg,rgba(5,9,16,.97) 62%,rgba(5,9,16,0) 100%)}
.search{position:relative;margin-bottom:9px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;line-height:0}
.search input{width:100%;padding:13px 40px 13px 42px;font:inherit;font-size:16px;color:var(--text);
  background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius-sm);outline:none;
  transition:border-color .2s,background .2s}
.search input::placeholder{color:var(--text-3);font-weight:300}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--card-hi)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--text-3);cursor:pointer;padding:8px;display:none;line-height:0;border-radius:8px}
.clear.on{display:block}
.clear:hover{color:var(--text)}

/* chip bar: pinned All + scroller + arrows */
.chipbar{display:flex;align-items:center;gap:7px}
.chips{flex:1 1 auto;display:flex;gap:7px;overflow-x:auto;scroll-behavior:smooth;padding:2px 0 3px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%)}
.chips.at-start{mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent 100%)}
.chips.at-end{mask-image:linear-gradient(90deg,transparent 0,#000 10px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px)}
.chips.at-start.at-end{mask-image:none;-webkit-mask-image:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:400;color:var(--text-2);
  background:var(--card);border:1px solid var(--stroke);border-radius:100px;cursor:pointer;white-space:nowrap;
  transition:all .18s var(--ease)}
.chip:hover{border-color:var(--stroke-hi);color:var(--text)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);font-weight:500}
.chip .n{opacity:.5;margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.chip.pinned{flex:0 0 auto}
.chipnav{flex:0 0 auto;display:flex;gap:3px}
.chipnav button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;
  border:1px solid var(--stroke);background:var(--card);color:var(--text-2);border-radius:50%;cursor:pointer;
  transition:all .18s var(--ease)}
.chipnav button:hover:not(:disabled){border-color:var(--stroke-hi);color:var(--text);background:var(--card-hi)}
.chipnav button:disabled{opacity:.25;cursor:default}
.chipnav[hidden]{display:none}

.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.count-label{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--stroke);border-radius:100px;padding:3px}
.seg button{font:inherit;font-size:12.5px;font-weight:400;padding:6px 11px;border:0;border-radius:100px;
  background:none;color:var(--text-3);cursor:pointer;white-space:nowrap;transition:all .18s var(--ease)}
.seg button:hover{color:var(--text-2)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--text);font-weight:500}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.group{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);
  padding:16px 4px 3px;font-weight:500}
.song{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 13px;background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius-sm);
  color:inherit;font:inherit;cursor:pointer;overflow:hidden;transition:all .18s var(--ease);
  animation:rise .3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.song:hover{border-color:var(--stroke-hi);background:var(--card-hi)}
.song:active{transform:scale(.988)}
.share{position:absolute;inset:0 auto 0 0;pointer-events:none;transition:width .5s var(--ease);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 15%,transparent),color-mix(in srgb,var(--accent) 3%,transparent))}
.song-body{flex:1;min-width:0;position:relative}
.song-title{font-size:15.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-bottom:2px}
.song-meta{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.03em;padding:1px 6px;border-radius:5px;margin-left:6px;
  background:rgba(255,255,255,.07);color:var(--text-3);vertical-align:1px;font-weight:400}
.tag.new{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.tbd{background:rgba(255,255,255,.05);color:var(--text-3);font-style:italic}
.votebox{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-width:52px;padding:5px 6px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);position:relative;transition:all .2s var(--ease)}
.votebox .num{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05}
.votebox .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.song:hover .votebox{border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}

.song.voted{border-color:color-mix(in srgb,var(--green) 45%,transparent);
  background:color-mix(in srgb,var(--green) 8%,transparent)}
.song.voted .votebox{border-color:color-mix(in srgb,var(--green) 50%,transparent);
  background:color-mix(in srgb,var(--green) 15%,transparent)}
.song.voted .votebox .num,.song.voted .votebox .lbl{color:var(--green)}
.song.playing{border-color:color-mix(in srgb,var(--accent) 50%,transparent);
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.song.playing .song-title{color:var(--accent)}
.song.locked{opacity:.42;cursor:not-allowed}
.song.locked:hover{border-color:var(--stroke);background:var(--card)}
.song.locked:active{transform:none}
.song.spent{opacity:.62}
.song.spent .votebox{border-style:dashed}

.empty{text-align:center;padding:52px 20px;color:var(--text-3)}
.empty strong{display:block;color:var(--text-2);font-weight:500;font-size:16px;margin-bottom:5px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,150%);
  background:rgba(20,29,56,.97);border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);color:var(--text);
  padding:12px 18px;border-radius:100px;font-size:14px;font-weight:500;z-index:50;
  box-shadow:0 12px 40px rgba(0,0,0,.6);transition:transform .38s var(--ease);
  display:flex;align-items:center;gap:9px;max-width:calc(100vw - 32px);backdrop-filter:blur(12px)}
.toast.show{transform:translate(-50%,0)}
.toast .tico{flex:0 0 auto;color:var(--green);line-height:0}
.toast.warn{border-color:rgba(255,255,255,.25)}
.toast.warn .tico{color:var(--accent)}

.run{margin:8px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:400}
.run:empty{display:none}
.nocat{text-align:center;padding:44px 24px;background:var(--card);border:1px dashed var(--stroke-hi);
  border-radius:var(--radius);color:var(--text-3);font-size:14px;line-height:1.7}
.nocat strong{display:block;color:var(--text-2);font-size:17px;font-weight:500;margin-bottom:8px}
.foot{text-align:center;padding:34px 10px 0;color:var(--text-3);font-size:12.5px;font-weight:300;line-height:1.75}
.review{display:inline-block;margin-top:10px;font-size:12px;color:var(--text-3);
  border:1px dashed rgba(255,255,255,.16);padding:6px 12px;border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-show="christmas">
<div class="bg"></div>
<canvas id="snow"></canvas>

<div class="wrap">

  <!-- Scaffolding only: in the real app the show follows whichever FPP playlist is running,
       and the vote allowance is a plugin setting. Exposed here so both can be felt. -->
  <div class="demo">
    <span class="demo-tag">Prototype controls</span>
    <div class="demo-grp">
      <span>Show</span>
      <div class="mini" id="showSeg">
        <button data-show="christmas" aria-pressed="true">Christmas</button>
        <button data-show="nye" aria-pressed="false">New Year's</button>
        <button data-show="halloween" aria-pressed="false">Halloween</button>
      </div>
    </div>
    <div class="demo-grp">
      <span>Votes each</span>
      <div class="mini" id="voteSeg">
        <button data-max="1" aria-pressed="false">1</button>
        <button data-max="2" aria-pressed="false">2</button>
        <button data-max="3" aria-pressed="true">3</button>
      </div>
    </div>
  </div>

  <header class="masthead">
    <span class="badge"><span class="dot"></span> <span id="showName">Christmas 2025</span></span>
    <p class="run" id="showNote"></p>
    <h1>Vote for the next song</h1>
    <p id="tagline">Tap any song. The winner plays next.</p>
  </header>

  <section class="np" id="npCard" aria-live="polite">
    <div class="np-top">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="np-label">Now playing</span>
    </div>
    <h2 class="np-title" id="npTitle">—</h2>
    <p class="np-meta" id="npMeta">—</p>
    <div class="track"><i id="npBar" style="width:0%"></i></div>
    <div class="np-times">
      <span id="npElapsed">0:00</span>
      <span class="closing" id="npClosing">Voting open</span>
      <span id="npTotal">0:00</span>
    </div>
  </section>

  <div class="meter" id="meter">
    <span class="pips" id="pips" aria-hidden="true"></span>
    <span id="meterText">3 votes left</span>
  </div>

  <div class="controls" id="controls">
    <div class="search">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input id="q" type="search" placeholder="Search songs or artists…" autocomplete="off" aria-label="Search songs">
      <button class="clear" id="clearBtn" aria-label="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="chipbar">
      <button class="chip pinned" id="chipAll" aria-pressed="true">All</button>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <div class="chipnav" id="chipnav">
        <button id="chipPrev" aria-label="Scroll categories left" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="chipNext" aria-label="Scroll categories right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="sortbar">
      <span class="count-label" id="countLabel"></span>
      <div class="seg" id="seg" role="group" aria-label="Sort songs">
        <button data-sort="votes" aria-pressed="true">Top</button>
        <button data-sort="az" aria-pressed="false">A–Z</button>
        <button data-sort="year" aria-pressed="false">Year</button>
        <button data-sort="order" aria-pressed="false">Playlist</button>
      </div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <footer class="foot">
    Votes reset when each song starts.<br>
    Tallies are kept separately for every show.
    <br><span class="review" id="reviewNote"></span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="tico" id="toastIco"></span>
  <span id="toastMsg">Vote counted</span>
</div>

<script>
/* ============================================================
   CATALOGS — one per show. Mirrors the proposed song-catalog.json:
     key (stable slug from the media filename) | title | artist | year | categories[]
   Vote tallies live against (showId, key), so shows never mix.
   year === null  ->  needs review; sorts last, shown as "Year TBD".
   ============================================================ */

/* ---- songs table: one row per song, show-agnostic. Curate once.
     Generated by build_catalog.py from the real FPP playlists.
     key is derived from sequenceName (the .fseq), never the playlist index. ---- */
const CATALOG = {
  "christmas-vacation":["Christmas Vacation",null,null],
  "christmas-sarajevo-12-24-instrumental":["Christmas Eve / Sarajevo 12/24","Trans-Siberian Orchestra",1996],
  "let-it-snow-baby-its-cold-outside":["Let It Snow, Baby; It's Cold Outside","Alex G and Robby Word",null],

/* ---------- build runtime state ---------- */
const stripArticle = t => t.replace(/^(the|a|an)\s+/i,"");
function buildShow(id){
  const cfg=SHOWS[id];
  return {
    id, name:cfg.name, tagline:cfg.tagline, note:cfg.note||"", cats:cfg.cats,
    songs:cfg.songs.map((row,i)=>{
      const [key,cats]=row;
      const meta=CATALOG[key];                 // <- join: show_songs -> songs
      if(!meta) throw new Error("Catalog miss: "+key);
      const [title,artist,year]=meta;
      return {
        key, title, artist, year, categories:cats,
        sortTitle:stripArticle(title),
        idx:i+1,               // runtime only — NEVER the identity
        votes:0, voted:false,
        lastPlayed:-1          // drives the tie-break
      };
    }),
    playingKey:null, cooldown:[], elapsed:0, duration:0, round:0
  };
}
const shows={christmas:buildShow("christmas"),nye:buildShow("nye"),halloween:buildShow("halloween")};
/* how many of this show's songs also appear in another show */
function sharedCount(id){
  const mine=new Set(SHOWS[id].songs.map(r=>r[0]));
  const others=new Set();
  Object.keys(SHOWS).filter(k=>k!==id).forEach(k=>SHOWS[k].songs.forEach(r=>others.add(r[0])));
  return [...mine].filter(k=>others.has(k)).length;
}

const state={ show:"christmas", q:"", cats:new Set(), sort:"votes", maxVotes:3 };
const S = () => shows[state.show];

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const fmt = s => Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const votesUsed = () => S().songs.filter(s=>s.voted).length;
const votesLeft = () => state.maxVotes - votesUsed();
const isLocked = s => s.key===S().playingKey || S().cooldown.includes(s.key);

/* ---------- filter + sort ---------- */
function visible(){
  const q=norm(state.q.trim());
  return S().songs.filter(s=>{
    if(state.cats.size && !s.categories.some(c=>state.cats.has(c))) return false;
    if(q && !(norm(s.title).includes(q) || norm(s.artist).includes(q) || String(s.year||"").includes(q))) return false;
    return true;
  });
}
function sorted(list){
  const a=[...list];
  if(state.sort==="votes") a.sort((x,y)=> y.votes-x.votes || x.lastPlayed-y.lastPlayed || x.sortTitle.localeCompare(y.sortTitle));
  if(state.sort==="az")    a.sort((x,y)=> x.sortTitle.localeCompare(y.sortTitle));
  if(state.sort==="year")  a.sort((x,y)=> (x.year??9999)-(y.year??9999) || x.sortTitle.localeCompare(y.sortTitle));
  if(state.sort==="order") a.sort((x,y)=> x.idx-y.idx);
  return a;
}
function groupOf(s){
  if(state.sort==="az")   return s.sortTitle.charAt(0).toUpperCase();
  if(state.sort==="year") return s.year===null ? "Year to confirm" : (s.year<1900 ? "Pre-1900" : Math.floor(s.year/10)*10+"s");
  return null;
}

/* ---------- chips ---------- */
function renderChips(){
  const c=$("#chips"); c.innerHTML="";
  $("#chipAll").setAttribute("aria-pressed", state.cats.size===0);
  S().cats.forEach(cat=>{
    const n=S().songs.filter(s=>s.categories.includes(cat)).length;
    const b=el("button","chip");
    b.type="button";
    b.append(document.createTextNode(cat));
    const sp=el("span","n"); sp.textContent=n; b.appendChild(sp);
    b.setAttribute("aria-pressed", state.cats.has(cat));
    b.dataset.cat=cat;
    b.onclick=()=>{ state.cats.has(cat)?state.cats.delete(cat):state.cats.add(cat); render(); };
    c.appendChild(b);
  });
  requestAnimationFrame(updateChipNav);
}
function updateChipNav(){
  const c=$("#chips"), nav=$("#chipnav");
  const overflowing = c.scrollWidth > c.clientWidth + 2;
  nav.hidden = !overflowing;
  const atStart = c.scrollLeft <= 1;
  const atEnd   = c.scrollLeft >= c.scrollWidth - c.clientWidth - 1;
  c.classList.toggle("at-start", atStart);
  c.classList.toggle("at-end", atEnd || !overflowing);
  $("#chipPrev").disabled = atStart;
  $("#chipNext").disabled = atEnd;
}
function scrollChips(dir){
  const c=$("#chips");
  c.scrollBy({left: dir * Math.max(140, c.clientWidth*0.7), behavior:"smooth"});
  setTimeout(updateChipNav,380);
}

/* ---------- vote meter ---------- */
function renderMeter(){
  const used=votesUsed(), left=votesLeft();
  const p=$("#pips"); p.innerHTML="";
  for(let i=0;i<state.maxVotes;i++){
    const d=el("span","pip"); if(i<used) d.classList.add("used"); p.appendChild(d);
  }
  $("#meter").classList.toggle("full", left===0);
  $("#meterText").innerHTML = state.maxVotes===1
    ? (used ? "Vote cast — tap another song to move it" : "You have <b>1</b> vote")
    : (left===0 ? "All <b>"+state.maxVotes+"</b> votes used — tap one to free it up"
                : "<b>"+left+"</b> of "+state.maxVotes+" votes left");
}

/* ---------- render ---------- */
function render(){
  const has = S().songs.length>0;
  $("#npCard").hidden = !has;
  $("#meter").hidden   = !has;
  $("#controls").hidden= !has;
  if(!has){
    const box=$("#list"); box.innerHTML="";
    const e=el("div","nocat");
    const st=el("strong"); st.textContent="No catalog yet";
    e.append(st, document.createTextNode(
      S().name+" hasn't been built. Once the FPP playlist exists and its songs are "+
      "categorised, they appear here \u2014 reusing catalog entries for any song you already play at another show."));
    box.appendChild(e);
    $("#countLabel").textContent="";
    updateReviewNote();
    return;
  }
  renderChips(); renderMeter();
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.sort===state.sort));
  $("#clearBtn").classList.toggle("on", state.q.length>0);

  const list=sorted(visible());
  const all=S().songs;
  const max=Math.max(1,...all.map(s=>s.votes));
  $("#countLabel").textContent = list.length===all.length ? all.length+" songs" : list.length+" of "+all.length;

  const box=$("#list"); box.innerHTML="";
  if(!list.length){
    const e=el("div","empty");
    const st=el("strong"); st.textContent="No songs match";
    e.append(st, document.createTextNode("Try a different search or clear your filters."));
    const btn=el("button","linkbtn"); btn.textContent="Clear all filters";
    btn.onclick=()=>{ state.q=""; $("#q").value=""; state.cats.clear(); render(); };
    e.appendChild(btn); box.appendChild(e); return;
  }

  let lastGroup=null;
  list.forEach((s,i)=>{
    const g=groupOf(s);
    if(g && g!==lastGroup){ const h=el("div","group"); h.textContent=g; box.appendChild(h); lastGroup=g; }

    const playing=s.key===S().playingKey, cool=S().cooldown.includes(s.key), locked=playing||cool;
    const spent = !s.voted && !locked && votesLeft()===0 && state.maxVotes>1;

    const b=el("button","song"); b.type="button";
    b.style.animationDelay=Math.min(i,18)*11+"ms";
    if(s.voted) b.classList.add("voted");
    if(playing) b.classList.add("playing");
    if(locked)  b.classList.add("locked");
    if(spent)   b.classList.add("spent");
    b.dataset.key=s.key;

    const share=el("div","share");
    share.style.width = s.votes ? (s.votes/max*100)+"%" : "0%";
    b.appendChild(share);

    const body=el("div","song-body");
    const t=el("div","song-title"); t.textContent=s.title;
    if(playing)      t.appendChild(mkTag("On now"));
    else if(cool)    t.appendChild(mkTag("Just played"));
    else if(s.categories.includes("New this year")) t.appendChild(mkTag("New","new"));
    const m=el("div","song-meta");
    m.textContent = s.artist+" · "+(s.year??"Year TBD")+" · "+s.categories.filter(c=>c!=="New this year").join(", ");
    body.append(t,m);

    const v=el("div","votebox");
    const num=el("span","num"); num.textContent=s.votes;
    const lbl=el("span","lbl"); lbl.textContent = s.voted?"voted":"votes";
    v.append(num,lbl);

    b.append(body,v);
    b.onclick=()=>vote(s);
    box.appendChild(b);
  });
}
function mkTag(text,cls){ const s=el("span","tag"+(cls?" "+cls:"")); s.textContent=text; return s; }

function refreshShares(){
  const max=Math.max(1,...S().songs.map(x=>x.votes));
  document.querySelectorAll(".song").forEach(r=>{
    const so=S().songs.find(x=>x.key===r.dataset.key); if(!so) return;
    r.querySelector(".share").style.width = so.votes ? (so.votes/max*100)+"%" : "0%";
  });
}

/* ---------- voting ---------- */
function vote(s){
  if(isLocked(s)){ toast("That one just played — pick another","warn"); return; }

  if(s.voted){                                   // take it back
    s.voted=false; s.votes--;
    buzz(8); render(); toast("Vote removed","warn"); return;
  }

  if(votesLeft()===0){
    if(state.maxVotes===1){                      // single vote: move it rather than block
      const prev=S().songs.find(x=>x.voted);
      prev.voted=false; prev.votes--;
      s.voted=true; s.votes++;
      buzz(18); render(); toast("Vote moved to “"+s.title+"”"); return;
    }
    toast("All "+state.maxVotes+" votes used — tap one to free it up","warn"); return;
  }

  s.voted=true; s.votes++;
  buzz(18);
  const row=document.querySelector('.song[data-key="'+s.key+'"]');
  if(row){                                        // update in place to keep scroll position
    row.classList.add("voted");
    const n=row.querySelector(".num"), l=row.querySelector(".lbl");
    n.textContent=s.votes; l.textContent="voted";
    n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump");
  }
  refreshShares(); renderMeter();
  if(votesLeft()===0 && state.maxVotes>1) render();   // dim the now-unavailable rows
  toast("Vote counted for “"+s.title+"”");
}
function buzz(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

let toastT;
function toast(msg,kind){
  $("#toastMsg").textContent=msg;
  const t=$("#toast");
  t.classList.toggle("warn", kind==="warn");
  $("#toastIco").innerHTML = kind==="warn"
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2300);
}

/* ---------- simulated show clock (stands in for the WebSocket feed) ---------- */
function startSong(key){
  const sh=S(), s=sh.songs.find(x=>x.key===key);
  sh.round++;
  sh.playingKey=key;
  s.lastPlayed=sh.round;
  sh.duration=170+Math.floor(Math.random()*90);
  sh.elapsed=0;
  sh.songs.forEach(x=>{ x.votes=0; x.voted=false; });   // votes reset every song
  paintNowPlaying();
  render();
}
function paintNowPlaying(){
  const sh=S(); if(!sh.playingKey) return;
  const s=sh.songs.find(x=>x.key===sh.playingKey); if(!s) return;
  $("#npTitle").textContent=s.title;
  $("#npMeta").textContent=s.artist+" · "+(s.year??"Year TBD");
  $("#npTotal").textContent=fmt(sh.duration);
  $("#npBar").style.width=(sh.elapsed/sh.duration*100)+"%";
  $("#npElapsed").textContent=fmt(sh.elapsed);
}

function tick(){
  Object.values(shows).forEach(sh=>{
    if(!sh.playingKey) return;
    sh.elapsed++;
    const remain=sh.duration-sh.elapsed;

    if(sh.id===state.show){
      $("#npBar").style.width=Math.min(100,sh.elapsed/sh.duration*100)+"%";
      $("#npElapsed").textContent=fmt(sh.elapsed);
      $("#npClosing").textContent = remain>20 ? "Voting open" : (remain>0 ? "Voting closes in "+remain+"s" : "Tallying…");
    }
    if(remain<=0){ nextSong(sh); return; }

    // other viewers voting
    if(remain>15 && Math.random()<0.5){
      const pool=sh.songs.filter(s=>s.key!==sh.playingKey && !sh.cooldown.includes(s.key));
      if(!pool.length) return;
      const pick=pool[Math.floor(Math.random()*pool.length)];
      pick.votes++;
      if(sh.id===state.show){
        const row=document.querySelector('.song[data-key="'+pick.key+'"]');
        if(row){
          const n=row.querySelector(".num"); n.textContent=pick.votes;
          n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump");
        }
        refreshShares();
      }
    }
  });
}

function nextSong(sh){
  const pool=sh.songs.filter(s=>s.key!==sh.playingKey && !sh.cooldown.includes(s.key));
  // ties break toward least-recently-played, so low turnout rotates the catalogue
  const winner=[...pool].sort((a,b)=> b.votes-a.votes || a.lastPlayed-b.lastPlayed)[0];
  sh.cooldown.push(sh.playingKey);
  while(sh.cooldown.length>4) sh.cooldown.shift();
  if(sh.id===state.show) toast("“"+winner.title+"” won — playing next");
  setTimeout(()=>{
    const wasCurrent = sh.id===state.show;
    sh.round++; sh.playingKey=winner.key; winner.lastPlayed=sh.round;
    sh.duration=170+Math.floor(Math.random()*90); sh.elapsed=0;
    sh.songs.forEach(x=>{ x.votes=0; x.voted=false; });
    if(wasCurrent){ paintNowPlaying(); render(); }
  },900);
}

/* ---------- show switching ---------- */
function switchShow(id){
  state.show=id; state.cats.clear(); state.q=""; $("#q").value="";
  document.body.dataset.show=id;
  document.querySelectorAll("#showSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.show===id));
  $("#showName").textContent=S().name;
  $("#showNote").textContent=S().note||"";
  $("#tagline").textContent=S().tagline;
  paintNowPlaying(); render(); updateReviewNote();
}
function updateReviewNote(){
  const sh=S(), total=sh.songs.length;
  if(!total){
    $("#reviewNote").textContent="Catalog is empty — nothing to review yet";
    return;
  }
  const n=sh.songs.filter(s=>s.year===null).length;
  const shared=sharedCount(sh.id);
  const bits=[];
  if(n) bits.push(n+" of "+total+" songs still need a release year");
  if(shared) bits.push(shared+" of "+total+" songs are shared with another show — one catalog entry each");
  $("#reviewNote").textContent = bits.length ? bits.join(" · ") : "Catalog complete";
}

/* ---------- snow / embers ---------- */
(function particles(){
  const c=document.getElementById("snow"), x=c.getContext("2d");
  let bits=[],w,h;
  function size(){
    w=c.width=innerWidth; h=c.height=innerHeight;
    bits=Array.from({length:Math.round(w/22)},()=>({
      x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.9+.5,
      d:Math.random()*.5+.18,s:Math.random()*.5+.15}));
  }
  size(); addEventListener("resize",()=>{size();updateChipNav();});
  (function draw(){
    x.clearRect(0,0,w,h);
    const show=document.body.dataset.show;
    x.fillStyle = show==="halloween" ? "rgba(255,170,90,.55)"
                : show==="nye"       ? "rgba(180,205,255,.6)"
                                     : "rgba(255,255,255,.75)";
    for(const f of bits){
      x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill();
      if(show==="halloween"){ f.y-=f.d*.8; if(f.y<-4){f.y=h+4;f.x=Math.random()*w;} }
      else { f.y+=f.d; if(f.y>h){f.y=-4;f.x=Math.random()*w;} }
      f.x+=Math.sin(f.y/45)*f.s;
    }
    requestAnimationFrame(draw);
  })();
})();

/* ---------- wire up ---------- */
$("#q").addEventListener("input",e=>{ state.q=e.target.value; render(); });
$("#clearBtn").onclick=()=>{ state.q=""; $("#q").value=""; render(); $("#q").focus(); };
$("#chipAll").onclick=()=>{ state.cats.clear(); render(); };
$("#chipPrev").onclick=()=>scrollChips(-1);
$("#chipNext").onclick=()=>scrollChips(1);
$("#chips").addEventListener("scroll",updateChipNav,{passive:true});
document.querySelectorAll("#seg button").forEach(b=> b.onclick=()=>{ state.sort=b.dataset.sort; render(); });
document.querySelectorAll("#showSeg button").forEach(b=> b.onclick=()=>switchShow(b.dataset.show));
document.querySelectorAll("#voteSeg button").forEach(b=> b.onclick=()=>{
  const n=+b.dataset.max;
  document.querySelectorAll("#voteSeg button").forEach(x=>x.setAttribute("aria-pressed", +x.dataset.max===n));
  // trim any votes over the new limit, oldest first
  const voted=S().songs.filter(s=>s.voted);
  for(let i=0;i<voted.length-n;i++){ voted[i].voted=false; voted[i].votes--; }
  state.maxVotes=n; render();
});

/* ---------- boot: every show starts mid-song with votes already in ---------- */
Object.values(shows).forEach(sh=>{
  if(!sh.songs.length) return;              // catalog not built yet
  sh.round=1;
  const first=sh.songs[Math.floor(Math.random()*sh.songs.length)];
  sh.playingKey=first.key; first.lastPlayed=1;
  sh.duration=170+Math.floor(Math.random()*90);
  sh.elapsed=Math.floor(sh.duration*0.3);
  sh.songs.forEach(s=>{ if(s.key!==sh.playingKey && Math.random()<.5) s.votes=Math.floor(Math.random()*9); });
});
switchShow("christmas");
setInterval(tick,1000);
</script>
