[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fppvote"
version = "0.1.0"
description = "Self-hosted song voting for a Falcon Player Christmas light show"
requires-python = ">=3.11"

# The runtime dependencies live here, once. requirements.txt installs this
# project (`-e .`) and adds the test-only ones, so there is one pinned list
# rather than two that drift.
dependencies = [
    "fastapi==0.115.6",
    # Bare uvicorn, not uvicorn[standard]: the "standard" extra pulls in
    # uvloop, which has no prebuilt wheel for Raspberry Pi OS's armv7l and has
    # to compile from C source on install -- and that build needs more scratch
    # space than a Pi's /tmp (a small RAM-backed tmpfs) has, failing with "No
    # space left on device" even though the real disk has room. uvloop is a
    # throughput optimization for many concurrent connections; irrelevant at
    # 1-3 concurrent voters. websockets is added explicitly instead, since
    # bare uvicorn has no WebSocket support at all without it -- it's what
    # /ws needs, and unlike uvloop it has a real ARM wheel.
    "uvicorn==0.34.0",
    "websockets==17.0.1",
    "httpx==0.28.1",
    "paho-mqtt==2.1.0",
    "jinja2==3.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# schema.sql and the voter page are part of the package, not incidental files
# next to it. Without this they are missing from an installed copy, which shows
# up as a working laptop and a broken Pi.
[tool.setuptools.package-data]
fppvote = ["db/*.sql", "web/static/*"]
